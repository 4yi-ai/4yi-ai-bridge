name: Feature request
description: Suggest a new integration or user workflow
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful workflow.
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Related AI application
      placeholder: Claude Code, Codex, OpenCode, or another app
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
