name: Release CLI

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Select protected npm channel
        id: channel
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-policy.mjs
      - name: Pack release artifact
        run: mkdir artifacts && npm pack --workspace @4yi/cli --pack-destination artifacts
      - name: Publish to npm with provenance
        run: npm publish --workspace @4yi/cli --provenance --access public --tag "${{ steps.channel.outputs.npm_tag }}"
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/*.tgz --clobber
